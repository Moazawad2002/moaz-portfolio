    <text x="250" y="142" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">41,200 ج.م</text>
    <rect x="340" y="129" width="75" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="377" y="143" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DISCOUNT 7%</text>

    <!-- Table Row 3 -->
    <text x="35" y="179" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SO-2026-0844</text>
    <text x="120" y="179" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Baraka Super (Maadi)</text>
    <text x="250" y="179" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">12,650 ج.م</text>
    <rect x="340" y="166" width="75" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="377" y="180" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">APPROVED</text>

