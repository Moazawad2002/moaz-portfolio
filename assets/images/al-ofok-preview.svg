    <text x="395" y="66" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Hard Policy Lock</text>

    <!-- Card 4 -->
    <rect x="570" y="0" width="170" height="75" rx="8" fill="url(#cardGrad)" stroke="#1e293b"/>
    <text x="585" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">COLLECTIONS RATIO</text>
