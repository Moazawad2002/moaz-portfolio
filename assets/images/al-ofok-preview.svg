      <circle cx="20" cy="25" r="9" fill="#10b981" fill-opacity="0.2"/>
      <path d="M16 25 L19 28 L25 22" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <text x="38" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Deterministic Stock Check</text>
      <text x="38" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Stock = OnHand - Reserved</text>
    </g>

    <!-- Flow Item 2 -->
    <g transform="translate(15, 115)">
      <rect x="0" y="0" width="255" height="50" rx="6" fill="#13203c" stroke="#1e293b"/>
      <circle cx="20" cy="25" r="9" fill="#f59e0b" fill-opacity="0.2"/>
      <path d="M20 18 L20 27 M20 31 L20 32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <text x="38" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">5% Discount Enforcement</text>
      <text x="38" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Auto-halts orders > 5% discount</text>
    </g>

    <!-- Flow Item 3 -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="255" height="50" rx="6" fill="#13203c" stroke="#1e293b"/>
      <circle cx="20" cy="25" r="9" fill="#3b82f6" fill-opacity="0.2"/>
      <path d="M16 25 L24 25 M20 21 L24 25 L20 29" stroke="#3b82f6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="38" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Credit Exposure Engine</text>
      <text x="38" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Blocks orders breaching ceiling</text>
    </g>

    <!-- Flow Item 4 -->
