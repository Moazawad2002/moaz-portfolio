      <text x="127" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Supabase PostgreSQL RLS</text>
      <text x="127" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Row-Level Security Per Rep / Admin</text>
    </g>
