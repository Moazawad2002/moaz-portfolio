  <circle cx="72" cy="47" r="5" fill="#f59e0b"/>
  <circle cx="89" cy="47" r="5" fill="#10b981"/>
  <text x="115" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Al Ofok B2B Distribution ERP • Live Ledger &amp; Inventory Gate System</text>
  <rect x="630" y="35" width="125" height="25" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="692" y="51" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RLS ENFORCED</text>

