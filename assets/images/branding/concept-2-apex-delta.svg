<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="100%" stop-color="#020612"/>
    </linearGradient>
    <linearGradient id="g2-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="g2-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="g2-delta" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#g2-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Architectural M Towers -->
  <!-- Left Wing of M -->
  <polygon points="18,74 18,26 34,26 44,52 32,74" fill="url(#g2-left)"/>
  <!-- Right Wing of M -->
  <polygon points="82,74 82,26 66,26 56,52 68,74" fill="url(#g2-right)"/>
  <!-- Negative Space / Ascending Glowing Delta A -->
  <polygon points="50,22 36,68 64,68" fill="none" stroke="url(#g2-delta)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Crossbar of A -->
  <line x1="41" y1="54" x2="59" y2="54" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Top Crown Node -->
  <circle cx="50" cy="22" r="3.5" fill="#ffffff"/>
</svg>
