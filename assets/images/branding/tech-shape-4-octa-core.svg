<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ts4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="ts4-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#ts4-bg)"/>
  
  <!-- Chamfered 45-degree Tech Octagon Shield -->
  <polygon points="34,14 66,14 86,34 86,66 66,86 34,86 14,66 14,34" fill="#090d15" stroke="url(#ts4-cyan)" stroke-width="2"/>

  <!-- Tech Trace Integrated MA Emblem -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- M outer path with 45-degree chamfered apexes -->
    <path d="M26 70 L26 36 L40 52 L50 40 L60 52 L74 36 L74 70" stroke="#ffffff" stroke-width="6"/>
    <!-- Interlocking A Prism & Crossbar -->
    <path d="M38 52 L50 26 L62 52" stroke="url(#ts4-cyan)" stroke-width="5.5"/>
    <line x1="42" y1="46" x2="58" y2="46" stroke="url(#ts4-cyan)" stroke-width="4.5"/>
  </g>
  <!-- Central Micro-Processor Node -->
  <circle cx="50" cy="26" r="3.5" fill="#ffffff"/>
  <rect x="47" y="58" width="6" height="12" rx="1" fill="url(#ts4-cyan)"/>
</svg>
