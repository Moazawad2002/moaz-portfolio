<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ts3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#030306"/>
    </linearGradient>
    <linearGradient id="ts3-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ts3-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#ts3-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#27273a" stroke-width="1.5"/>

  <!-- High-Tech Interlocking Angular Chevrons -->
  <g fill="none" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Outer Chevron Wing 1 (Left Upright) -->
    <path d="M22 72 L22 34 L40 54" stroke="url(#ts3-blue)"/>
    
    <!-- Central Elevated Tech Delta A -->
    <path d="M38 68 L50 24 L62 68" stroke="#ffffff" stroke-width="7.5"/>
    <line x1="43" y1="52" x2="57" y2="52" stroke="#38bdf8" stroke-width="5.5"/>

    <!-- Outer Chevron Wing 2 (Right Upright) -->
    <path d="M60 54 L78 34 L78 72" stroke="url(#ts3-purple)"/>
  </g>
  <!-- Data Datum Nodes -->
  <circle cx="50" cy="24" r="3.5" fill="#38bdf8"/>
</svg>
