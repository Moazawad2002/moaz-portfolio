<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#030710"/>
    </linearGradient>
    <linearGradient id="g1-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#g1-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#g1-stroke)" stroke-width="1.8" stroke-opacity="0.35"/>
  <!-- Interlocking M-A Monogram -->
  <g fill="none" stroke="url(#g1-stroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- M Left Stem -->
    <path d="M22 72 L22 28"/>
    <!-- M Left Down-Diagonal -->
    <path d="M22 28 L42 58"/>
    <!-- Unified Apex Upward: M's right-up + A's left-up -->
    <path d="M42 58 L58 24"/>
    <!-- A Right Down-Stem -->
    <path d="M58 24 L78 72"/>
    <!-- M Inner Right Vertical Stem -->
    <path d="M42 58 L42 72" stroke-width="6"/>
    <!-- A Horizontal Data Crossbar -->
    <path d="M48 52 L70 52" stroke-width="5.5" stroke="#38bdf8"/>
  </g>
  <!-- Apex Glowing Data Pulse -->
  <circle cx="58" cy="24" r="4.5" fill="#38bdf8" filter="url(#glow1)"/>
</svg>
