<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Executive Deep Slate Backdrop -->
  <rect width="100" height="100" rx="22" fill="#0b0f19"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Unified Architectural M-A Ligature -->
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Continuous Stroke: M Left -> M Valley -> A Apex -> A Right -->
    <path d="M20 72 L20 28 L40 56 L60 26 L80 72" stroke="#ffffff"/>
    <!-- M Right Vertical Stem (anchors the M structure) -->
    <path d="M40 56 L40 72" stroke="#ffffff"/>
    <!-- A Floating Executive Crossbar -->
    <line x1="48" y1="54" x2="72" y2="54" stroke="#38bdf8" stroke-width="7"/>
  </g>
</svg>
