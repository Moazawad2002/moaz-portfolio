  <polygon points="34,56 34,18 48,46 40,68" fill="url(#ts2-em2)"/>

  <!-- Right Wing of M (Dual Polygons) -->
  <polygon points="82,72 82,34 66,18 66,56" fill="url(#ts2-em1)"/>
  <polygon points="66,56 66,18 52,46 60,68" fill="url(#ts2-em2)"/>

  <!-- Center Floating Tech Delta 'A' -->
  <polygon points="50,24 38,72 62,72" fill="url(#ts2-cyan)" opacity="0.95"/>
  <polygon points="50,42 43,64 57,64" fill="#090f1d"/>
  <line x1="42" y1="58" x2="58" y2="58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
