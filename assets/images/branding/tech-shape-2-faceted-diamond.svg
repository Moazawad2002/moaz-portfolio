<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ts2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="ts2-em1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ts2-em2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ts2-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#ts2-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Faceted Tech Rhombus / Shards Glyph -->
  <!-- Left Wing of M (Dual Polygons) -->
