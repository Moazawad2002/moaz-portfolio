      <text x="395" y="24" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10" font-weight="700">EXPIRATION WARNING</text>
      <text x="395" y="54" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="700">4 Batches &lt;30d</text>
      <text x="395" y="72" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Automated Dispatch Priority</text>
