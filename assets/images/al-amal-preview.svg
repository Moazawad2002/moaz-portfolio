      <text x="15" y="24" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10" font-weight="700">NET SALES (MONTHLY)</text>
      <text x="15" y="54" fill="#f4eedb" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1,940,500 ج.م</text>
      <text x="15" y="72" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Target 2.2M (88.2% Hit)</text>

      <!-- Card 2 -->
      <rect x="190" y="0" width="175" height="85" rx="8" fill="url(#amalCard)" stroke="#3d3424"/>
      <text x="205" y="24" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10" font-weight="700">COLLECTED CASH</text>
      <text x="205" y="54" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1,680,200 ج.م</text>
      <text x="205" y="72" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">86.6% Collection Rate</text>

