        <text x="12" y="20" fill="#f4eedb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Rep 1: North Cairo</text>
        <text x="12" y="34" fill="#d49b24" font-family="system-ui, sans-serif" font-size="9.5">Shubra • Zaytoun • Heliopolis</text>
        <line x1="12" y1="44" x2="153" y2="44" stroke="#2d261b"/>
        <text x="12" y="62" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">Net Sales: 680,400 ج.م</text>
        <text x="12" y="80" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">Target: 650,000 ج.م</text>
        <text x="12" y="98" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700">104.7% Attainment</text>
        <rect x="12" y="105" width="141" height="5" rx="2" fill="#2d261b"/>
        <rect x="12" y="105" width="141" height="5" rx="2" fill="#10b981"/>
      </g>

      <!-- Rep 2 Box -->
      <g transform="translate(198, 42)">
        <rect x="0" y="0" width="165" height="120" rx="6" fill="#1a1711" stroke="#3d3424"/>
        <text x="12" y="20" fill="#f4eedb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Rep 2: Giza &amp; Haram</text>
        <text x="12" y="34" fill="#d49b24" font-family="system-ui, sans-serif" font-size="9.5">Zayed • 6th Oct • Mohandessin</text>
        <line x1="12" y1="44" x2="153" y2="44" stroke="#2d261b"/>
        <text x="12" y="62" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">Net Sales: 590,200 ج.م</text>
        <text x="12" y="80" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">Target: 600,000 ج.م</text>
        <text x="12" y="98" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">98.4% Attainment</text>
        <rect x="12" y="105" width="141" height="5" rx="2" fill="#2d261b"/>
        <rect x="12" y="105" width="138" height="5" rx="2" fill="#f59e0b"/>
      </g>

      <!-- Rep 3 Box -->
      <g transform="translate(378, 42)">
        <rect x="0" y="0" width="165" height="120" rx="6" fill="#1a1711" stroke="#3d3424"/>
        <text x="12" y="20" fill="#f4eedb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Rep 3: East Cairo</text>
        <text x="12" y="34" fill="#d49b24" font-family="system-ui, sans-serif" font-size="9.5">New Cairo • Maadi • Nasr City</text>
        <line x1="12" y1="44" x2="153" y2="44" stroke="#2d261b"/>
        <text x="12" y="62" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">Net Sales: 669,900 ج.م</text>
        <text x="12" y="80" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10">Target: 650,000 ج.م</text>
        <text x="12" y="98" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700">103.1% Attainment</text>
        <rect x="12" y="105" width="141" height="5" rx="2" fill="#2d261b"/>
        <rect x="12" y="105" width="141" height="5" rx="2" fill="#10b981"/>
      </g>
    </g>

    <!-- Bottom Section: Tech Stack & Architecture Badges -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="565" height="110" rx="8" fill="url(#amalCard)" stroke="#3d3424"/>
      <text x="18" y="24" fill="#f4eedb" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Desktop Engineering Specifications</text>
      
      <g transform="translate(18, 38)">
        <rect x="0" y="0" width="165" height="55" rx="5" fill="#1a1711" stroke="#3d3424"/>
        <text x="12" y="22" fill="#d49b24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Electron + React 18</text>
        <text x="12" y="40" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="9.5">Native Windows packaging (NSIS)</text>
      </g>

      <g transform="translate(195, 38)">
        <rect x="0" y="0" width="165" height="55" rx="5" fill="#1a1711" stroke="#3d3424"/>
        <text x="12" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Row-Level Security</text>
        <text x="12" y="40" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="9.5">PostgreSQL strict user data isolation</text>
      </g>

      <g transform="translate(372, 38)">
        <rect x="0" y="0" width="175" height="55" rx="5" fill="#1a1711" stroke="#3d3424"/>
        <text x="12" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Automated QA Suite</text>
        <text x="12" y="40" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="9.5">auth.test, financial.test, inventory.test</text>
      </g>
