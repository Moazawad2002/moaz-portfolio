<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="amalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1913"/>
      <stop offset="100%" stop-color="#12100c"/>
    </linearGradient>
    <linearGradient id="amalCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a251b"/>
      <stop offset="100%" stop-color="#201c14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d49b24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#amalBg)"/>
  
  <!-- Subtle Amber Glow -->
  <circle cx="400" cy="50" r="280" fill="#d49b24" opacity="0.06"/>

  <!-- Windows Desktop Header Bar -->
  <rect x="25" y="20" width="750" height="40" rx="8" fill="#241f17" stroke="#3d3424" stroke-width="1"/>
  <rect x="35" y="32" width="16" height="16" rx="3" fill="#d49b24"/>
  <text x="43" y="44" fill="#12100c" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">A</text>
  <text x="60" y="45" fill="#f4eedb" font-family="system-ui, sans-serif" font-size="12" font-weight="700">شركة الأمل لتوزيع المنتجات الغذائية — Al Amal Desktop ERP (Windows 64-bit)</text>
  
  <!-- Window Controls -->
  <g transform="translate(710, 32)">
    <line x1="0" y1="8" x2="8" y2="8" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="15" y="4" width="8" height="8" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="30" y1="4" x2="38" y2="12" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="38" y1="4" x2="30" y2="12" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Left Sidebar Navigation -->
  <g transform="translate(25, 70)">
    <rect x="0" y="0" width="170" height="405" rx="8" fill="#201c15" stroke="#3d3424"/>
    <text x="20" y="28" fill="#d49b24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">OPERATIONAL MODULES</text>
    
    <!-- Active Nav -->
    <rect x="10" y="40" width="150" height="34" rx="6" fill="#d49b24" fill-opacity="0.15" stroke="#d49b24" stroke-width="1"/>
    <text x="24" y="62" fill="#f4eedb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Executive Dashboard</text>

    <!-- Nav 2 -->
    <text x="24" y="105" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11.5">Sales Invoices &amp; Orders</text>
    <!-- Nav 3 -->
    <text x="24" y="145" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11.5">Central Warehouse</text>
    <!-- Nav 4 -->
    <text x="24" y="185" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11.5">Batch Expiration Alert</text>
    <!-- Nav 5 -->
    <text x="24" y="225" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11.5">Collections &amp; Aging</text>
    <!-- Nav 6 -->
    <text x="24" y="265" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11.5">Reps Performance</text>
    <!-- Nav 7 -->
    <text x="24" y="305" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11.5">Treasury &amp; OPEX</text>
    <!-- Nav 8 -->
    <text x="24" y="345" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11.5">Excel / CSV Migration</text>

    <!-- User Badge -->
